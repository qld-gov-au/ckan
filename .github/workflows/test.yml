---
name: Tests
on:
  push:

jobs:
  test:
    strategy:
      matrix:
        ckan-version: [2.8]
        segment: ['0123', '4567', '89ab', 'cdef']

    services:
      postgres:
        image: ckan/ckan-postgres-dev:${{ matrix.ckan-version }}
      solr:
        image: ckan/ckan-solr-dev:${{ matrix.ckan-version }}
      redis:
          image: redis:3

    name: CKAN ${{ matrix.ckan-version }}
    runs-on: ubuntu-latest
    container:
      image: python:2-stretch

    steps:
      - uses: actions/checkout@v2
        timeout-minutes: 2

      - name: Install CKAN
        run: |
          pip install -r requirement-setuptools.txt
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          python setup.py develop

      - name: Run tests
        env:
          SEGMENT: ${{ matrix.segment }}
        run: |
          nosetests -v --ckan --reset-db --with-pylons=test-core-github.ini --nologcapture --with-coverage --cover-package=ckan --cover-package=ckanext ckan ckanext --segments $SEGMENT
